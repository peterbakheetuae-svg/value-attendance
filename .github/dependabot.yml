# VA-13: dependency update / security pull requests (free). Nothing merges by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
