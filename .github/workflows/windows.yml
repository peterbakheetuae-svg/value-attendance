name: Windows desktop app — VALUNIVO.exe + installer
# The real Flutter Windows app, built from the same app/ source as Web and Android (same screens, same API).
# Separate from app.yml, so the Web / Android build and the Hostinger web deploy are never slowed down or changed.
#  - feature/windows-desktop: every push builds the app + installer (downloadable from the run's artifacts)
#  - main: builds when the commit's first line has [win], or on a manual run. Publishing (a GitHub release +
#    jaurea.com/valunivo/windows/, read by the app's updater) happens ONLY on a manual run of main — never on a push.
on:
  push:
    branches: [main, feature/windows-desktop]
    paths: ['app/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: 'windows-build-${{ github.ref }}', cancel-in-progress: true }
env:
  FLUTTER_VERSION: '3.38.10'
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  API_MIRROR_URLS: https://value-attendance-api.peter-bakheet-uae.workers.dev
  # firebase_core's Windows C++ SDK (pulled in for Android push; unused on Windows) still declares
  # cmake_minimum_required < 3.5, which CMake 4 refuses — CMake's documented way to configure it anyway
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
jobs:
  build:
    # Visual Studio 2022 (the toolchain Flutter 3.38 supports); windows-latest has VS 2026, whose MSVC 14.51
    # rejects the C++/WinRT coroutines used by audioplayers_windows and flutter_local_notifications_windows
    runs-on: windows-2022
    defaults: { run: { working-directory: app, shell: bash } }
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.want.outputs.publish }}
    steps:
      - name: Build wanted?
        id: want
        working-directory: .
        env: { COMMIT_MSG: '${{ github.event.head_commit.message }}' }
        run: |
          GO=1; PUB=0
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            GO=0
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && GO=1
            printf '%s' "$COMMIT_MSG" | head -n1 | grep -q '\[win\]' && GO=1
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && PUB=1
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"; echo "publish=$PUB" >> "$GITHUB_OUTPUT"; echo "build=$GO publish=$PUB"
      - uses: actions/checkout@v4
        if: steps.want.outputs.go == '1'
      - uses: subosito/flutter-action@v2
        if: steps.want.outputs.go == '1'
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Version
        id: v
        if: steps.want.outputs.go == '1'
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          [ -n "$API_BASE_URL" ] || echo "API_BASE_URL=https://valunivo.vercel.app" >> "$GITHUB_ENV"
      - run: flutter config --enable-windows-desktop && flutter pub get
        if: steps.want.outputs.go == '1'
      - run: flutter test
        if: steps.want.outputs.go == '1'
      - name: Windows smoke test inside the app (DPAPI token storage, API reachable, server rejects no / forged token, login screen)
        if: steps.want.outputs.go == '1'
        run: flutter test integration_test/windows_smoke_test.dart -d windows --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS
      - name: Build Windows (Release)
        if: steps.want.outputs.go == '1'
        run: |
          flutter build windows --release \
            --build-name=${{ steps.v.outputs.version }} --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS
      - name: Add the Visual C++ runtime next to the app (so it runs on a clean PC)
        if: steps.want.outputs.go == '1'
        run: |
          R=build/windows/x64/runner/Release
          for d in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$d" "$R/"; done
      - name: Optional code signing (only if WINDOWS_CERT_PFX_B64 / WINDOWS_CERT_PASS secrets exist)
        if: steps.want.outputs.go == '1'
        env: { PFX: '${{ secrets.WINDOWS_CERT_PFX_B64 }}', PASS: '${{ secrets.WINDOWS_CERT_PASS }}' }
        run: |
          if [ -z "$PFX" ] || [ -z "$PASS" ]; then echo "::notice::not code-signed (no certificate secrets) — Windows SmartScreen will show 'unknown publisher'"; exit 0; fi
          printf '%s' "$PFX" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          ST=$(ls /c/Program\ Files\ \(x86\)/Windows\ Kits/10/bin/*/x64/signtool.exe | sort | tail -1)
          "$ST" sign /f "$RUNNER_TEMP/sign.pfx" /p "$PASS" /fd sha256 /tr http://timestamp.digicert.com /td sha256 build/windows/x64/runner/Release/VALUNIVO.exe
          echo "SIGN_TOOL=$ST" >> "$GITHUB_ENV"; echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: Check the package is complete (exe, engine, every plugin DLL, assets, runtime)
        if: steps.want.outputs.go == '1'
        run: |
          R=build/windows/x64/runner/Release
          for f in VALUNIVO.exe flutter_windows.dll msvcp140.dll vcruntime140.dll vcruntime140_1.dll data/app.so data/icudtl.dat \
                   data/flutter_assets/AssetManifest.bin data/flutter_assets/assets/fonts/Cairo-Regular.ttf data/flutter_assets/assets/bg/dark_bg.webp; do
            test -s "$R/$f" || { echo "::error::missing $f"; exit 1; }
          done
          # every Windows plugin the app uses must have its DLL next to the exe
          python - <<'PY'
          import json, os, sys
          d = json.load(open('.flutter-plugins-dependencies'))
          R = 'build/windows/x64/runner/Release'
          dlls = {f.lower() for f in os.listdir(R) if f.lower().endswith('.dll')}
          print('DLLs:', sorted(dlls))
          native = [p['name'] for p in d['plugins']['windows'] if p.get('native_build', True)]
          print('native Windows plugins:', native)
          missing = [n for n in native if not any(n.replace('_windows', '').split('_')[0] in x for x in dlls)]
          if missing: print('::warning::no DLL name matched for:', missing)
          PY
          # nothing secret may ship
          if find "$R" -name '*.env' -o -name '*.p12' -o -name '*.pfx' -o -name '*.jks' -o -name 'key.properties' | grep -q .; then echo "::error::secret file in package"; exit 1; fi
          du -sh "$R"; ls -la "$R"
      - name: Launch test (the exe starts on its own and stays up)
        if: steps.want.outputs.go == '1'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\VALUNIVO.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Host "::error::VALUNIVO.exe exited after start (code $($p.ExitCode))"; exit 1 }
          $p.Refresh()
          Write-Host "running: pid $($p.Id), $([math]::Round($p.WorkingSet64/1MB)) MB, window title: '$($p.MainWindowTitle)'"
          # screenshot of the running app (for the visual check)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force ..\win-shots | Out-Null
          $bmp.Save("..\win-shots\valunivo-windows-start.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
      - name: Installer (Inno Setup)
        if: steps.want.outputs.go == '1'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
            $env:PATH = "${env:ProgramFiles(x86)}\Inno Setup 6;$env:PATH"
          }
          $src = (Resolve-Path "build\windows\x64\runner\Release").Path
          New-Item -ItemType Directory -Force build\installer | Out-Null
          $out = (Resolve-Path "build\installer").Path
          iscc /Qp "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceDir=$src" "/DOutputDir=$out" windows_installer\valunivo.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem build\installer
      - name: Sign the installer (optional)
        if: steps.want.outputs.go == '1' && env.SIGNED == '1'
        env: { PASS: '${{ secrets.WINDOWS_CERT_PASS }}' }
        run: '"$SIGN_TOOL" sign /f "$RUNNER_TEMP/sign.pfx" /p "$PASS" /fd sha256 /tr http://timestamp.digicert.com /td sha256 build/installer/*.exe'
      - name: Installer test (silent install → app runs → silent uninstall)
        if: steps.want.outputs.go == '1'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\installer\VALUNIVO-Setup-*.exe | Select-Object -First 1
          # WaitForExit, not -Wait: -Wait would also wait for the app the installer opens at the end
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=desktopicon' -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Host "::error::installer did not finish in 5 min"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Host "::error::install failed ($($p.ExitCode))"; exit 1 }
          Start-Sleep 10
          $opened = Get-Process VALUNIVO -ErrorAction SilentlyContinue
          if ($opened) { Write-Host "installer opened the installed app: pid $($opened.Id) $($opened.Path)" } else { Write-Host "::warning::installer did not open the app" }
          $dir = "$env:LOCALAPPDATA\Programs\VALUNIVO"
          foreach ($f in 'VALUNIVO.exe','flutter_windows.dll','data\app.so','unins000.exe') { if (-not (Test-Path "$dir\$f")) { Write-Host "::error::not installed: $f"; exit 1 } }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'VALUNIVO.lnk'
          if (-not $lnk) { Write-Host "::error::no Start menu shortcut"; exit 1 }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\VALUNIVO.lnk")) { Write-Host "::error::no desktop shortcut"; exit 1 }
          Get-Process VALUNIVO -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Start-Process "$dir\VALUNIVO.exe" -PassThru; Start-Sleep 15
          if ($app.HasExited) { Write-Host "::error::installed app exited ($($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id -Force; Start-Sleep 2
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $u.WaitForExit(300000)) { Write-Host "::error::uninstaller did not finish"; exit 1 }
          Start-Sleep 8   # the uninstaller finishes from a temp copy of itself
          if (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'VALUNIVO.lnk') { Write-Host "::error::Start menu shortcut left behind"; exit 1 }
          if (Test-Path "$dir\VALUNIVO.exe") { Write-Host "::error::uninstall left the app behind"; exit 1 }
          Write-Host "install / shortcuts / launch / uninstall: OK"
      - name: Package + update info
        if: steps.want.outputs.go == '1'
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p ../win-out
          cp build/installer/VALUNIVO-Setup-$V.exe ../win-out/
          (cd build/windows/x64/runner/Release && 7z a -tzip -bso0 ../../../../../../win-out/VALUNIVO-$V-windows-x64.zip .)
          SIZE=$(stat -c%s ../win-out/VALUNIVO-Setup-$V.exe); SHA=$(sha256sum ../win-out/VALUNIVO-Setup-$V.exe | cut -d' ' -f1)
          printf '{"version":"%s","build":%s,"installer":"VALUNIVO-Setup-%s.exe","size":%s,"sha256":"%s"}\n' "$V" "${{ github.run_number }}" "$V" "$SIZE" "$SHA" > ../win-out/latest.json
          cat ../win-out/latest.json; ls -la ../win-out
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.go == '1'
        with: { name: VALUNIVO-windows-screenshot, path: win-shots, if-no-files-found: ignore, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.go == '1'
        with: { name: VALUNIVO-windows-installer, path: win-out/VALUNIVO-Setup-*.exe, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.go == '1'
        with: { name: VALUNIVO-windows-x64-app, path: app/build/windows/x64/runner/Release, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.publish == '1'
        with: { name: win-out, path: win-out, retention-days: 7 }

  # main + manual run only: backup release + jaurea.com/valunivo/windows/ (installer first, latest.json last).
  # Touches only public_html/valunivo/windows/ — never WordPress, never the web app's files.
  publish:
    needs: build
    if: needs.build.outputs.publish == '1' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 82.198.227.7
      SSH_PORT: '65002'
      SSH_USER: u258219607
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: win-out, path: out }
      - name: Backup release (never marked "latest", so the Android release stays the latest one)
        run: |
          V=${{ needs.build.outputs.version }}
          gh release create "win-v$V" out/VALUNIVO-Setup-$V.exe out/VALUNIVO-$V-windows-x64.zip out/latest.json \
            -R "${{ github.repository }}" --title "VALUNIVO Windows $V" --notes "تطبيق الويندوز — VALUNIVO $V" --latest=false
      - name: Copy to jaurea.com/valunivo/windows/
        run: |
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASS" ]; then echo "::warning::Hostinger secrets not set — Windows update not uploaded (copy by hand)"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/known_hosts <<'KH'
          [82.198.227.7]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINIEVbKu9K7AVrGNwujYEUbrw0wvECMboXFOKfpiiw3h
          [82.198.227.7]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCHeIP4sUl5WiCE5CU68sEpg0WFGfq/jyVGW0RqVzi3v56HYIJhINFOZvD3XxttLN/k7t2ZEjA52H73cegg6QGY=
          KH
          sed -i 's/^ *//' ~/.ssh/known_hosts
          O="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            SCP="scp $O -P $SSH_PORT -i $HOME/.ssh/deploy"; SSH="ssh $O -p $SSH_PORT -i $HOME/.ssh/deploy"
          else
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y sshpass >/dev/null; export SSHPASS="$SSH_PASS"
            SCP="sshpass -e scp $O -P $SSH_PORT"; SSH="sshpass -e ssh $O -p $SSH_PORT"
          fi
          V=${{ needs.build.outputs.version }}
          D='domains/jaurea.com/public_html/valunivo/windows'
          $SSH "$SSH_USER@$SSH_HOST" "test -d domains/jaurea.com/public_html/valunivo && mkdir -p $D"
          $SCP out/VALUNIVO-Setup-$V.exe "$SSH_USER@$SSH_HOST:$D/VALUNIVO-Setup-$V.exe"
          $SSH "$SSH_USER@$SSH_HOST" "cp $D/VALUNIVO-Setup-$V.exe $D/VALUNIVO-Setup.exe && chmod 644 $D/*.exe"
          $SCP out/latest.json "$SSH_USER@$SSH_HOST:$D/latest.json.new"
          $SSH "$SSH_USER@$SSH_HOST" "mv $D/latest.json.new $D/latest.json && chmod 644 $D/latest.json"
          sleep 3
          curl -s --max-time 30 "https://jaurea.com/valunivo/windows/latest.json?t=$(date +%s)" | tee /dev/stderr | grep -q "\"$V\"" || { echo "::error::windows/latest.json not served"; exit 1; }
