name: Forms - sample PDFs from the app code
# Builds a blank and a filled custody receipt with the app's own code (flutter test) and attaches them to the
# "form-samples" pre-release, to compare the printed result with the approved original. Nothing is deployed.
on:
  push:
    branches: [pending-build]
    paths: ['app/lib/jph/forms/**', 'app/assets/forms/**', 'app/test/custody_receipt_pdf_test.dart', '.github/workflows/forms-sample.yml']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.38.10', channel: stable, cache: true }
      - name: Build the samples
        working-directory: app
        run: |
          flutter pub get
          flutter test test/custody_receipt_pdf_test.dart
          ls -la build/form-samples
      - name: Attach them to the form-samples pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view form-samples >/dev/null 2>&1 || gh release create form-samples --prerelease --title "Form samples (not an app release)" --notes "Sample PDFs of the printed forms, for review only."
          gh release upload form-samples app/build/form-samples/*.pdf --clobber
