name: App — analyze only (waiting branch, no build / no deploy)
on:
  # pending-build-permissions / feature/ui-sales-commission-2026-11-24: owner-approved check branches, same steps, nothing published
  push: { branches: [pending-build, pending-build-permissions, feature/ui-sales-commission-2026-11-24], paths: ['app/**', '.github/workflows/app-check.yml'] }
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: '3.38.10', channel: stable, cache: true }
      - run: flutter pub get
      - name: Analyze (errors fail)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt; grep -E "^\s*error •" analyze.txt | head -200; ! grep -qE "^\s*error •" analyze.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - name: Android build check (throwaway key, nothing published)
        run: |
          flutter create --platforms=android,web --org com.jph.valueattendance --project-name jph_real_estate_hr .
          dart run tool/patch_android.dart
          P=$(openssl rand -hex 16)
          keytool -genkeypair -storetype PKCS12 -keystore /tmp/check.p12 -alias valueattendance -keyalg RSA -keysize 2048 -validity 2 -storepass "$P" -keypass "$P" -dname "CN=check"
          printf 'storeFile=/tmp/check.p12\nstorePassword=%s\nkeyAlias=valueattendance\nkeyPassword=%s\n' "$P" "$P" > android/key.properties
          flutter build apk --release --build-name=1.0.999 --build-number=999
      - name: Web build check (same base path as GitHub Pages and jaurea.com/valunivo/)
        run: |
          flutter build web --release --base-href /valunivo/
          cp deploy/hostinger/.htaccess build/web/.htaccess
          grep -q '<base href="/valunivo/">' build/web/index.html
          ls -la build/web build/web/assets/assets/bg build/web/assets/assets/sounds; du -sh build/web
      - name: Keep the web build for a visual check (1 day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: web-preview, path: app/build/web, retention-days: 1 }
