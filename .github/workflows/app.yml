name: App — test, Web + Android, deploy to Hostinger (jaurea.com/valunivo)
on:
  push: { branches: [main], paths: ['app/**', '.github/workflows/app.yml'] }
  workflow_dispatch:
    inputs:
      # Publish an APK that was ALREADY built and signed by an earlier run of this workflow (no rebuild):
      # the phones' update file (android/latest.json) then names it. Empty = a normal build.
      apk_from_run: { description: 'run id whose value-attendance-apk artifact to publish (empty = normal build)', required: false, default: '' }
      apk_version: { description: 'that APK version, e.g. 1.0.118', required: false, default: '' }
      apk_sha256: { description: 'expected SHA-256 of that APK', required: false, default: '' }
      web_from_run: { description: 'run id whose deploy-out (web.zip, the web that is live now) goes with it', required: false, default: '' }
      # release-prep/integration-* only: put an earlier Android update back (folder name printed by the update's backup step)
      android_rollback_from: { description: 'Android rollback: backup folder on the server, e.g. android-20261123T090000Z', required: false, default: '' }
permissions:
  contents: write   # keeps a copy of each build as a release (backup); the live app and its updates are on Hostinger
# release-prep/* candidates get their own queue: they never cancel (or wait behind) a main build
concurrency: { group: "${{ startsWith(github.ref, 'refs/heads/release-prep/') && format('app-candidate-{0}', github.ref) || 'app-build' }}", cancel-in-progress: true }
env:
  FLUTTER_VERSION: '3.38.10'
  # Public HTTPS URL of the API (repository variable, not a secret — it ships in the app anyway)
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  # Mirror (Cloudflare Worker forwarding to the API) tried first: some mobile networks block or throttle host domains
  API_MIRROR_URLS: https://value-attendance-api.peter-bakheet-uae.workers.dev
  # Firebase client config for phone push — public by design (it ships inside every app; not a secret).
  # The server-side key (FCM_SERVICE_ACCOUNT) lives only in Netlify's environment.
  FIREBASE_DEFINES: >-
    --dart-define=FIREBASE_API_KEY=AIzaSyBpuGxRAmut3r_mCMtvdtqYMlnW3uNNvHY
    --dart-define=FIREBASE_APP_ID=1:1055799246852:android:1f3156a362edc90023f551
    --dart-define=FIREBASE_SENDER_ID=1055799246852
    --dart-define=FIREBASE_PROJECT_ID=bustling-syntax-480805-k4
jobs:
  build:
    if: ${{ !inputs.apk_from_run && !inputs.android_rollback_from }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Generate platform folders (first run only)
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --org com.jph.valueattendance --project-name jph_real_estate_hr .
          fi
          dart run tool/patch_android.dart
          echo "--- release manifest permissions ---"; grep -n "uses-permission\|<application" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get --enforce-lockfile
      - name: Analyze (errors fail; original JPH screens keep their lint warnings)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt; grep -E "^\s*error •" analyze.txt | head -200; ! grep -qE "^\s*error •" analyze.txt
      - run: flutter test
      - name: API URL check
        run: |
          if [ -z "$API_BASE_URL" ]; then
            # Public API URL (not a secret). Override with the repository variable API_BASE_URL if it moves.
            echo "API_BASE_URL=https://valunivo.vercel.app" >> "$GITHUB_ENV"
          fi
      - name: Release candidate (release-prep/* manual run) — its version; no publish / deploy step runs on these branches
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release-prep/')
        run: |
          # Web and Android of one run carry ONE version, 1.0.<run>+<run> (the Android channel's rule: the third part is the
          # build). Windows keeps its own channel numbering (windows.yml) — its updater compares Windows builds only.
          echo "CANDIDATE=1" >> "$GITHUB_ENV"
          echo "RV=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_ARGS=--build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "candidate 1.0.${{ github.run_number }}+${{ github.run_number }} from ${{ github.sha }}"
      - name: Build Web (WebAssembly — faster; browsers without it get the JavaScript build automatically)
        run: flutter build web --release --wasm --base-href "/valunivo/" $VERSION_ARGS --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS
      - name: Web Push (notifications for the web app on iPhone / browsers) — its worker + helper next to the app
        run: |
          cp web_push/push-sw.js web_push/va-push.js build/web/
          python3 - <<'PY'
          p = 'build/web/index.html'; s = open(p).read()
          assert '</head>' in s and 'va-push.js' not in s
          open(p, 'w').write(s.replace('</head>', '  <script src="va-push.js" defer></script>\n</head>', 1))
          PY
          grep -q 'va-push.js' build/web/index.html
      - name: The start of loading — the orbiting logo until the app's first frame
        run: |
          cp web_loader/va-loader.js build/web/   # its script is a file, not inline: the enforced CSP allows no inline script
          python3 - <<'PY'
          p = 'build/web/index.html'; s = open(p).read()
          loader = open('web_loader/loader.html').read()
          assert '<body>' in s and 'va-loader' not in s
          open(p, 'w').write(s.replace('<body>', '<body>\n' + loader, 1))
          PY
          grep -q 'va-loader' build/web/index.html
      - name: Start the first-screen files early (preload) instead of one after another
        run: |
          # Fetched right away while main.dart.js is still being prepared; no cache rule changes, so updates stay instant.
          # crossorigin="anonymous" = the same request mode Flutter's own fetch uses, so the preloaded copy is reused.
          python3 - <<'PY'
          import os
          files = ['assets/AssetManifest.bin.json', 'assets/FontManifest.json', 'assets/fonts/MaterialIcons-Regular.otf',
                   'assets/assets/fonts/Cairo-Regular.ttf', 'assets/assets/fonts/Cairo-SemiBold.ttf', 'assets/assets/fonts/Cairo-Bold.ttf',
                   'assets/assets/fonts/NotoFlags.ttf', 'assets/assets/l10n/ar.json', 'assets/assets/l10n/en.json',
                   'assets/assets/jph_l10n/ar.json', 'assets/assets/bg/site_backdrop.jpeg', 'assets/assets/images/logo_letter.png', 'assets/assets/images/logo_orbit.png']
          files = [f for f in files if os.path.exists('build/web/' + f)]
          tags = ''.join(f'  <link rel="preload" href="{f}" as="fetch" crossorigin="anonymous">\n' for f in files)
          p = 'build/web/index.html'; s = open(p).read()
          assert '</head>' in s and 'rel="preload"' not in s
          open(p, 'w').write(s.replace('</head>', tags + '</head>', 1))
          print(tags)
          PY
      - name: Hostinger copy of the web build (+ its own folder-only .htaccess) and validation
        run: |
          rm -rf build/hostinger && cp -r build/web build/hostinger
          cp deploy/hostinger/.htaccess build/hostinger/.htaccess
          # the build must be complete and point at /valunivo/ before anything is uploaded
          for f in index.html va-loader.js flutter_bootstrap.js main.dart.js assets/AssetManifest.bin.json assets/assets/bg/dark_bg.webp push-sw.js va-push.js; do
            test -s "build/hostinger/$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q '<base href="/valunivo/">' build/hostinger/index.html || { echo "::error::wrong base href"; exit 1; }
          # VA-08 regression guard: the security headers stay in the deployed .htaccess
          for h in Strict-Transport-Security Referrer-Policy X-Frame-Options Permissions-Policy "Content-Security-Policy \"default-src 'self'"; do
            grep -q "Header always set $h" build/hostinger/.htaccess || { echo "::error::security header missing: $h"; exit 1; }
          done
          # the enforced CSP: no framing, no inline script (the page has none — the loader is va-loader.js)
          csp=$(grep -o 'Header always set Content-Security-Policy "[^"]*"' build/hostinger/.htaccess)
          for d in "frame-ancestors 'none'" "object-src 'none'" "base-uri 'self'" "script-src 'self' 'wasm-unsafe-eval'"; do
            case "$csp" in *"$d"*) ;; *) echo "::error::CSP lost: $d"; exit 1;; esac
          done
          case "$csp" in *"script-src"*"'unsafe-inline'"*"; style-src"*) echo "::error::CSP script-src allows inline"; exit 1;; esac
          if python3 -c "import re,sys; s=open('build/hostinger/index.html').read(); sys.exit(0 if re.search(r'<script(?![^>]*\\bsrc=)[^>]*>', s) else 1)"; then
            echo "::error::inline <script> in index.html — the enforced CSP would block it"; exit 1
          fi
          # nothing secret may ship in the public folder
          if find build/hostinger -name '*.env' -o -name '*.p12' -o -name '*.jks' -o -name 'key.properties' | grep -q .; then echo "::error::secret file in build"; exit 1; fi
          # no debug leftovers: source maps / Dart sources never ship
          if find build/hostinger -name '*.map' -o -name '*.dart' | grep -q .; then echo "::error::source map / source file in build"; exit 1; fi
          du -sh build/hostinger; find build/hostinger -type f -size +300k -exec ls -la {} \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: hostinger-web, path: app/build/hostinger, include-hidden-files: true, retention-days: 14 }
      - name: Release signing key (kept only in repository secrets — never in the code)
        env:
          KEY_PASS: '${{ secrets.ANDROID_KEY_PASS }}'
          KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}'
        run: |
          if [ -z "$KEY_PASS" ] || [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS secrets not set — APK stays debug-signed and no Android update is published"; exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          # a wrong key / password never blocks the web: the APK just is not published (and the build says why)
          if ! keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEY_PASS" >/dev/null 2>&1; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS do not match (wrong password or a broken copy of the key) — no Android update this time"; rm -f "$RUNNER_TEMP/release.p12"; exit 0
          fi
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEY_PASS" | awk -F, '/PrivateKeyEntry/{print $1; exit}')
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.p12" "$KEY_PASS" "$ALIAS" "$KEY_PASS" > android/key.properties
          # VA-02: the signing certificate's public SHA-256 fingerprint (not secret) — to compare with installed builds
          keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEY_PASS" | grep -m1 'SHA256:' | sed 's/^[[:space:]]*/release signing cert /' || true
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: Android build wanted? ([apk] in the commit's first line, or a manual run)
        env: { COMMIT_MSG: '${{ github.event.head_commit.message }}' }
        run: |
          # a manual run builds the APK on main only
          W=0; [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && W=1
          # a release candidate (release-prep/*) builds the APK too — signed with the release key or not at all
          if [ "$CANDIDATE" = "1" ]; then
            [ "$SIGNED" = "1" ] || { echo "::error::release candidate: the release signing key is not available — no APK (never a debug-signed one)"; exit 1; }
            W=1
          fi
          printf '%s' "$COMMIT_MSG" | head -n1 | grep -q '\[apk\]' && W=1
          echo "BUILD_APK=$W" >> "$GITHUB_ENV"; echo "build APK: $W"
      - name: Build Android APK
        # a web-only update skips the (slow) Android build entirely, so the web goes out quickly
        if: env.BUILD_APK == '1'
        run: flutter build apk --release ${VERSION_ARGS:---build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}} --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS $FIREBASE_DEFINES
      - name: Release candidate — verify the APK (signature, same certificate as the published release, package, version)
        if: env.CANDIDATE == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-verify.txt || { echo "::error::no v2 signature"; exit 1; }
          ! grep -qi 'CN=Android Debug' apk-verify.txt || { echo "::error::debug-signed"; exit 1; }
          # the permanent copy of the last published Android release (GitHub release, read only)
          PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=50" -q '[.[] | select(.prerelease | not) | select(.draft | not) | .tag_name | select(test("^v1[.]0[.][0-9]+$"))][0]')
          [ -n "$PREV" ] || { echo "::error::no published Android release to compare the certificate with"; exit 1; }
          gh release download "$PREV" -R "${{ github.repository }}" -p value-attendance.apk -O published.apk
          grep 'SHA-256 digest' apk-verify.txt | head -1 | tee new.cert
          "$BT/apksigner" verify --print-certs published.apk | grep 'SHA-256 digest' | head -1 | tee old.cert
          cmp new.cert old.cert || { echo "::error::signing certificate differs from the published $PREV"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "package: name='com.jph.valueattendance" badging.txt || { echo "::error::application id"; exit 1; }
          grep -q "versionCode='${{ github.run_number }}'" badging.txt && grep -q "versionName='$RV'" badging.txt || { echo "::error::version"; exit 1; }
          echo "candidate APK $RV (${{ github.run_number }}) — same signing certificate as $PREV; sha256 $(sha256sum "$APK" | cut -d' ' -f1)"
          mkdir -p ../candidate && cp "$APK" "../candidate/VALUNIVO-$RV-android.apk" && cp apk-verify.txt badging.txt ../candidate/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.CANDIDATE == '1'
        with: { name: release-candidate-android, path: candidate, retention-days: 30 }
      - name: Publish the update (backup copy as a release; phones and browsers get it from Hostinger)
        # the web-only pre-release never needs the Android key; an Android ([apk]) release does
        id: pub
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}', COMMIT_MSG: '${{ github.event.head_commit.message }}' }
        run: |
          V=1.0.${{ github.run_number }}
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && cp build/app/outputs/flutter-apk/app-release.apk value-attendance.apk
          # the same web build for jaurea.com/valunivo/ (public files only: the app that already ships to every browser)
          (cd build/hostinger && zip -qr ../../value-attendance-web.zip .)
          EXTRA=""; [ -f value-attendance-web-wasm-test.zip ] && EXTRA=value-attendance-web-wasm-test.zip
          # Phones update themselves from the *latest* release. A new Android version is published only when the commit
          # message says [apk]; otherwise the web build goes out as a pre-release (phones ignore pre-releases).
          WANT_APK=0; printf '%s' "$COMMIT_MSG" | head -n1 | grep -q '\[apk\]' && WANT_APK=1
          # a manual run (Actions → Run workflow) is an Android update too — it builds the APK for that
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && WANT_APK=1
          # without the signing key an Android update is never published (phones would refuse it); the web still goes out
          [ -f value-attendance.apk ] || WANT_APK=0
          if [ "$WANT_APK" = "1" ] && [ "$SIGNED" != "1" ]; then
            echo "::warning::[apk] asked but the ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS secrets are not set — web only, no Android update"; WANT_APK=0
          fi
          # what goes to Hostinger: the web build, and — for an Android update — the APK + latest.json (phones read it)
          mkdir -p ../deploy-out/android && cp value-attendance-web.zip ../deploy-out/web.zip
          if [ "$WANT_APK" = "1" ]; then
            cp value-attendance.apk "../deploy-out/android/value-attendance-$V.apk"
            SIZE=$(stat -c%s value-attendance.apk); SHA=$(sha256sum value-attendance.apk | cut -d' ' -f1)
            printf '{"version":"%s","build":%s,"apk":"value-attendance-%s.apk","size":%s,"sha256":"%s"}\n' "$V" "${{ github.run_number }}" "$V" "$SIZE" "$SHA" > ../deploy-out/android/latest.json
            cat ../deploy-out/android/latest.json
          fi
          echo "apk=$WANT_APK" >> "$GITHUB_OUTPUT"
          if [ "$WANT_APK" = "1" ]; then
            gh release create "v$V" value-attendance.apk value-attendance-web.zip $EXTRA --title "Value Attendance $V" --notes "تحديث تلقائي للتطبيق" --latest
          else
            gh release create "web-$V" value-attendance-web.zip $EXTRA --title "Web build $V (no Android update)" --notes "نسخة الويب فقط" --prerelease
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.BUILD_APK == '1'
        with: { name: value-attendance-apk, path: app/build/app/outputs/flutter-apk/app-release.apk, retention-days: 30 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with: { name: deploy-out, path: deploy-out, retention-days: 7 }

  # The live app: https://jaurea.com/valunivo/ (+ /android/ for phone updates; the old /value-attendance/ redirects there and keeps its /android/ for phones on older versions). Sent over SSH (encrypted,
  # server key pinned below) and placed by app/deploy/hostinger/remote-deploy.sh into public_html/valunivo/ (+ the old public_html/value-attendance/)
  # ONLY — WordPress is fingerprinted before / after and the deploy fails if anything there changed.
  # Needs ONE repository secret: HOSTINGER_SSH_KEY (private key whose public half is added in hPanel → SSH Access)
  # or HOSTINGER_SSH_PASSWORD. Without it the step is skipped and the build is copied over by hand.
  hostinger:
    needs: build
    # SEC-02: production web deploy from main only (the old feature/tracking-controls exception is removed). The
    # environment lets the owner restrict the Hostinger deploy credentials to main (Settings → Environments).
    if: github.ref == 'refs/heads/main'
    environment: production-release
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 82.198.227.7
      SSH_PORT: '65002'
      SSH_USER: u258219607
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
    steps:
      - name: Secret present?
        id: s
        run: |
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASS" ]; then
            echo "::warning::HOSTINGER_SSH_KEY / HOSTINGER_SSH_PASSWORD not set — Hostinger deploy skipped (copy by hand)"; echo "go=0" >> "$GITHUB_OUTPUT"
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.s.outputs.go == '1'
        with: { sparse-checkout: app/deploy/hostinger }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.s.outputs.go == '1'
        with: { name: deploy-out, path: out }
      - name: Copy to the server and deploy
        if: steps.s.outputs.go == '1'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # the server's own keys — the connection is refused if anything else answers
          cat > ~/.ssh/known_hosts <<'KH'
          [82.198.227.7]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINIEVbKu9K7AVrGNwujYEUbrw0wvECMboXFOKfpiiw3h
          [82.198.227.7]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCHeIP4sUl5WiCE5CU68sEpg0WFGfq/jyVGW0RqVzi3v56HYIJhINFOZvD3XxttLN/k7t2ZEjA52H73cegg6QGY=
          KH
          sed -i 's/^ *//' ~/.ssh/known_hosts
          OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -P $SSH_PORT"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            SCP="scp $OPTS -i $HOME/.ssh/deploy"; SSH="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT -i $HOME/.ssh/deploy"
          else
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y sshpass >/dev/null
            export SSHPASS="$SSH_PASS"
            SCP="sshpass -e scp $OPTS"; SSH="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT"
          fi
          $SSH "$SSH_USER@$SSH_HOST" 'rm -rf ~/va-staging && mkdir -p ~/va-staging/android'
          $SCP out/web.zip "$SSH_USER@$SSH_HOST:va-staging/web.zip"
          if [ -s out/android/latest.json ]; then $SCP out/android/* "$SSH_USER@$SSH_HOST:va-staging/android/"; fi
          $SSH "$SSH_USER@$SSH_HOST" 'bash -s' < app/deploy/hostinger/remote-deploy.sh
      - name: Check jaurea.com (WordPress unchanged) and the app
        if: steps.s.outputs.go == '1'
        run: |
          sleep 5
          code() { curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$1"; }
          for u in https://jaurea.com/ https://www.jaurea.com/; do c=$(code $u); echo "$u -> $c"; [ "$c" = 200 ] || { echo "::error::$u -> $c"; exit 1; }; done
          curl -sL --max-time 30 https://jaurea.com/ | grep -q 'wp-content' || { echo "::error::WordPress home page looks different"; exit 1; }
          curl -s --max-time 30 https://jaurea.com/valunivo/ | grep -q '<base href="/valunivo/">' || { echo "::error::app index not served"; exit 1; }
          # the old address sends people to the new one
          curl -sL --max-time 30 https://jaurea.com/value-attendance/ | grep -q '<base href="/valunivo/">' || { echo "::error::old address does not redirect"; exit 1; }
          for f in flutter_bootstrap.js main.dart.js assets/AssetManifest.bin.json assets/assets/bg/dark_bg.webp; do
            c=$(code "https://jaurea.com/valunivo/$f"); echo "$f -> $c"; [ "$c" = 200 ] || { echo "::error::$f -> $c"; exit 1; }
          done
          if [ -s out/android/latest.json ]; then
            for d in valunivo value-attendance; do
              curl -s --max-time 30 "https://jaurea.com/$d/android/latest.json" | tee /dev/stderr | grep -q "$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' out/android/latest.json)" || { echo "::error::$d/android/latest.json not updated"; exit 1; }
            done
          fi

  # Android update from an APK built earlier (no rebuild): checked (SHA-256, version, the same signing certificate as the
  # APK phones have now), then sent with the web that is already live through the same SSH + remote-deploy.sh as above.
  android-publish:
    # SEC-02: main only (was feature/tracking-controls — an unreviewed branch could publish to phones)
    if: ${{ inputs.apk_from_run && github.ref == 'refs/heads/main' }}
    environment: production-release
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    env:
      SSH_HOST: 82.198.227.7
      SSH_PORT: '65002'
      SSH_USER: u258219607
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
      V: ${{ inputs.apk_version }}
      WANT_SHA: ${{ inputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: app/deploy/hostinger }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: value-attendance-apk, path: apk, run-id: '${{ inputs.apk_from_run }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: deploy-out, path: out, run-id: '${{ inputs.web_from_run }}', github-token: '${{ github.token }}' }
      - name: Check the APK (SHA-256, version, package, signing certificate = the published one)
        run: |
          set -euo pipefail
          [[ "$V" =~ ^1\.0\.([0-9]+)$ ]] || { echo "::error::bad version $V"; exit 1; }
          B=${BASH_REMATCH[1]}
          SHA=$(sha256sum apk/app-release.apk | cut -d' ' -f1); echo "sha256 $SHA"
          [ "$SHA" = "$WANT_SHA" ] || { echo "::error::SHA-256 differs"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging apk/app-release.apk | head -1 | tee badging.txt
          grep -q "name='com.jph.valueattendance" badging.txt || grep -q "package: name='" badging.txt
          grep -q "versionCode='$B'" badging.txt || { echo "::error::versionCode is not $B"; exit 1; }
          grep -q "versionName='$V'" badging.txt || { echo "::error::versionName is not $V"; exit 1; }
          PUB=$(curl -fsS --max-time 30 "https://jaurea.com/valunivo/android/latest.json?t=$(date +%s)")
          echo "published now: $PUB"
          OLDAPK=$(printf '%s' "$PUB" | sed -n 's/.*"apk" *: *"\([^"]*\)".*/\1/p'); OLDB=$(printf '%s' "$PUB" | sed -n 's/.*"build" *: *\([0-9]*\).*/\1/p')
          [ "$B" -gt "$OLDB" ] || { echo "::error::$B is not newer than the published $OLDB"; exit 1; }
          curl -fsS --max-time 120 -o old.apk "https://jaurea.com/valunivo/android/$OLDAPK"
          "$BT/apksigner" verify --print-certs apk/app-release.apk | grep 'SHA-256 digest' | tee new.cert
          "$BT/apksigner" verify --print-certs old.apk | grep 'SHA-256 digest' | tee old.cert
          [ -s new.cert ] && cmp new.cert old.cert || { echo "::error::signing certificate differs from the published APK"; exit 1; }
          mkdir -p out/android
          cp apk/app-release.apk "out/android/value-attendance-$V.apk"
          SIZE=$(stat -c%s apk/app-release.apk)
          printf '{"version":"%s","build":%s,"apk":"value-attendance-%s.apk","size":%s,"sha256":"%s"}\n' "$V" "$B" "$V" "$SIZE" "$SHA" > out/android/latest.json
          cat out/android/latest.json
          test -s out/web.zip
          ls -la out out/android
      - name: Copy to the server and deploy (same as the hostinger job)
        run: |
          [ -n "$SSH_KEY" ] || [ -n "$SSH_PASS" ] || { echo "::error::no Hostinger secret"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/known_hosts <<'KH'
          [82.198.227.7]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINIEVbKu9K7AVrGNwujYEUbrw0wvECMboXFOKfpiiw3h
          [82.198.227.7]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCHeIP4sUl5WiCE5CU68sEpg0WFGfq/jyVGW0RqVzi3v56HYIJhINFOZvD3XxttLN/k7t2ZEjA52H73cegg6QGY=
          KH
          sed -i 's/^ *//' ~/.ssh/known_hosts
          OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -P $SSH_PORT"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            SCP="scp $OPTS -i $HOME/.ssh/deploy"; SSH="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT -i $HOME/.ssh/deploy"
          else
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y sshpass >/dev/null
            export SSHPASS="$SSH_PASS"
            SCP="sshpass -e scp $OPTS"; SSH="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT"
          fi
          $SSH "$SSH_USER@$SSH_HOST" 'rm -rf ~/va-staging && mkdir -p ~/va-staging/android'
          $SCP out/web.zip "$SSH_USER@$SSH_HOST:va-staging/web.zip"
          $SCP out/android/* "$SSH_USER@$SSH_HOST:va-staging/android/"
          $SSH "$SSH_USER@$SSH_HOST" 'bash -s' < app/deploy/hostinger/remote-deploy.sh
      - name: Check (WordPress unchanged, the update is served, same file)
        run: |
          set -eu  # no pipefail: grep -q closes the pipe early
          sleep 5
          code() { curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$1"; }
          for u in https://jaurea.com/ https://www.jaurea.com/; do c=$(code $u); echo "$u -> $c"; [ "$c" = 200 ]; done
          curl -sL --max-time 30 https://jaurea.com/ | grep -q 'wp-content'
          curl -s --max-time 30 https://jaurea.com/valunivo/ | grep -q '<base href="/valunivo/">'
          for d in valunivo value-attendance; do
            J=$(curl -fsS --max-time 30 "https://jaurea.com/$d/android/latest.json?t=$(date +%s)"); echo "$d: $J"
            printf '%s' "$J" | grep -q "\"version\":\"$V\""
            curl -fsS --max-time 180 -o got.apk "https://jaurea.com/$d/android/value-attendance-$V.apk"
            [ "$(sha256sum got.apk | cut -d' ' -f1)" = "$WANT_SHA" ] || { echo "::error::$d APK differs"; exit 1; }
            curl -sI --max-time 30 "https://jaurea.com/$d/android/value-attendance-$V.apk" | grep -i 'content-type\|content-length'
          done
          curl -fsS --max-time 180 -o fixed.apk https://jaurea.com/valunivo/android/value-attendance.apk
          [ "$(sha256sum fixed.apk | cut -d' ' -f1)" = "$WANT_SHA" ]
          echo "update served: $V"

  # Android-only update from a verified release candidate (release-prep/integration-* branch): no rebuild, the web is
  # NOT touched. The candidate run's APK is checked again (SHA-256, package, version, not debug, same signing certificate
  # as the APK phones have now, newer build), the served files are backed up on the server (verified) before anything
  # is replaced, and the public URLs are downloaded afterwards and compared byte for byte. A rollback restores a backup.
  android-update:
    if: ${{ (inputs.apk_from_run || inputs.android_rollback_from) && startsWith(github.ref, 'refs/heads/release-prep/integration-') }}
    environment: production-release
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    env:
      SSH_HOST: 82.198.227.7
      SSH_PORT: '65002'
      SSH_USER: u258219607
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
      V: ${{ inputs.apk_version }}
      WANT_SHA: ${{ inputs.apk_sha256 }}
      RB: ${{ inputs.android_rollback_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: app/deploy/hostinger }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !inputs.android_rollback_from }}
        with: { name: release-candidate-android, path: cand, run-id: '${{ inputs.apk_from_run }}', github-token: '${{ github.token }}' }
      - name: Check the candidate APK (SHA-256, package, version, release-signed, same certificate as the published APK, newer)
        if: ${{ !inputs.android_rollback_from }}
        run: |
          set -euo pipefail
          [[ "$V" =~ ^1\.0\.([0-9]+)$ ]] || { echo "::error::bad version $V"; exit 1; }
          B=${BASH_REMATCH[1]}
          F="cand/VALUNIVO-$V-android.apk"; test -s "$F" || { echo "::error::candidate APK $F missing"; exit 1; }
          SHA=$(sha256sum "$F" | cut -d' ' -f1); echo "sha256 $SHA"
          [ "$SHA" = "$WANT_SHA" ] || { echo "::error::SHA-256 differs from the approved candidate"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$F" | head -1 | tee badging.txt
          grep -q "package: name='com.jph.valueattendance'" badging.txt || { echo "::error::application id"; exit 1; }
          grep -q "versionCode='$B'" badging.txt && grep -q "versionName='$V'" badging.txt || { echo "::error::version"; exit 1; }
          ! "$BT/aapt2" dump badging "$F" | grep -q "application-debuggable" || { echo "::error::debuggable APK"; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs "$F" | tee verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' verify.txt || { echo "::error::no v2 signature"; exit 1; }
          ! grep -qi 'CN=Android Debug' verify.txt || { echo "::error::debug-signed"; exit 1; }
          PUB=$(curl -fsS --max-time 30 "https://jaurea.com/valunivo/android/latest.json?t=$(date +%s)"); echo "published now: $PUB"
          OLDAPK=$(printf '%s' "$PUB" | sed -n 's/.*"apk" *: *"\([^"]*\)".*/\1/p'); OLDB=$(printf '%s' "$PUB" | sed -n 's/.*"build" *: *\([0-9]*\).*/\1/p')
          [ "$B" -gt "$OLDB" ] || { echo "::error::$B is not newer than the published $OLDB"; exit 1; }
          curl -fsS --max-time 180 -o old.apk "https://jaurea.com/valunivo/android/$OLDAPK"
          grep 'SHA-256 digest' verify.txt | head -1 > new.cert
          "$BT/apksigner" verify --print-certs old.apk | grep 'SHA-256 digest' | head -1 > old.cert
          cat new.cert old.cert
          [ -s new.cert ] && cmp new.cert old.cert || { echo "::error::signing certificate differs from the published APK"; exit 1; }
          mkdir -p out && cp "$F" "out/value-attendance-$V.apk"
          SIZE=$(stat -c%s "$F")
          printf '{"version":"%s","build":%s,"apk":"value-attendance-%s.apk","size":%s,"sha256":"%s"}\n' "$V" "$B" "$V" "$SIZE" "$SHA" > out/latest.json
          cat out/latest.json
      - name: Back up what is served, then update (or roll back) — Android files only
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || [ -n "$SSH_PASS" ] || { echo "::error::no Hostinger secret"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/known_hosts <<'KH'
          [82.198.227.7]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINIEVbKu9K7AVrGNwujYEUbrw0wvECMboXFOKfpiiw3h
          [82.198.227.7]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCHeIP4sUl5WiCE5CU68sEpg0WFGfq/jyVGW0RqVzi3v56HYIJhINFOZvD3XxttLN/k7t2ZEjA52H73cegg6QGY=
          KH
          sed -i 's/^ *//' ~/.ssh/known_hosts
          OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -P $SSH_PORT"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            SCP="scp $OPTS -i $HOME/.ssh/deploy"; SSH="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT -i $HOME/.ssh/deploy"
          else
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y sshpass >/dev/null
            export SSHPASS="$SSH_PASS"
            SCP="sshpass -e scp $OPTS"; SSH="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT"
          fi
          if [ -n "$RB" ]; then
            $SSH "$SSH_USER@$SSH_HOST" "bash -s -- rollback '$RB'" < app/deploy/hostinger/remote-android-update.sh
          else
            $SSH "$SSH_USER@$SSH_HOST" 'rm -rf ~/va-staging-android && mkdir -p ~/va-staging-android'
            $SCP out/* "$SSH_USER@$SSH_HOST:va-staging-android/"
            $SSH "$SSH_USER@$SSH_HOST" 'bash -s -- update' < app/deploy/hostinger/remote-android-update.sh
          fi
      - name: Check the public URLs (both addresses) serve exactly the approved file; WordPress unchanged
        if: ${{ !inputs.android_rollback_from }}
        run: |
          set -eu
          sleep 5
          code() { curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$1"; }
          for u in https://jaurea.com/ https://www.jaurea.com/; do c=$(code $u); echo "$u -> $c"; [ "$c" = 200 ]; done
          curl -sL --max-time 30 https://jaurea.com/ | grep -q 'wp-content'
          curl -s --max-time 30 https://jaurea.com/valunivo/ | grep -q '<base href="/valunivo/">'
          for d in valunivo value-attendance; do
            J=$(curl -fsS --max-time 30 "https://jaurea.com/$d/android/latest.json?t=$(date +%s)"); echo "$d: $J"
            [ "$J" = "$(cat out/latest.json)" ] || { echo "::error::$d/android/latest.json is not the new one"; exit 1; }
            for f in "value-attendance-$V.apk" value-attendance.apk; do
              curl -fsS --max-time 300 -o got.apk "https://jaurea.com/$d/android/$f?t=$(date +%s)"
              G=$(sha256sum got.apk | cut -d' ' -f1); echo "$d/android/$f sha256 $G size $(stat -c%s got.apk)"
              [ "$G" = "$WANT_SHA" ] || { echo "::error::$d/android/$f differs from the approved APK"; exit 1; }
            done
            curl -sI --max-time 30 "https://jaurea.com/$d/android/value-attendance-$V.apk" | grep -iE 'content-type|content-length'
          done
          echo "update served: $V"
      - name: Permanent copy as a GitHub release (as every Android update before it)
        if: ${{ !inputs.android_rollback_from }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp out/value-attendance-$V.apk value-attendance.apk
          # the commit the APK was built from (the candidate run), not the commit of this publishing run
          SRC=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.apk_from_run }}" -q .head_sha)
          gh release create "v$V" value-attendance.apk -R "${{ github.repository }}" --target "$SRC" \
            --title "Value Attendance $V" --notes "تحديث أندرويد — نسخة الإصدار المتكامل (${{ github.ref_name }}). الويب لم يتغير." --latest
      - name: Check after rollback
        if: ${{ inputs.android_rollback_from }}
        run: for d in valunivo value-attendance; do curl -fsS --max-time 30 "https://jaurea.com/$d/android/latest.json?t=$(date +%s)"; echo; done
