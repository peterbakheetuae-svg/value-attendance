name: App — test, Web (GitHub Pages), Android APK
on:
  push: { branches: [main], paths: ['app/**', '.github/workflows/app.yml'] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
env:
  FLUTTER_VERSION: '3.38.0'
  # Public HTTPS URL of the API (repository variable, not a secret — it ships in the app anyway)
  API_BASE_URL: ${{ vars.API_BASE_URL }}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Generate platform folders (first run only)
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --org com.jph.valueattendance --project-name jph_real_estate_hr .
          fi
          dart run tool/patch_android.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Require API_BASE_URL
        run: test -n "$API_BASE_URL" || (echo "Set repository variable API_BASE_URL (https://...)"; exit 1)
      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Build Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-artifact@v4
        with: { name: value-attendance-apk, path: app/build/app/outputs/flutter-apk/app-release.apk, retention-days: 30 }
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
