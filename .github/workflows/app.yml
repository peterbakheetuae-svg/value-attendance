name: App — test, Web (GitHub Pages), Android APK
on:
  push: { branches: [main], paths: ['app/**', '.github/workflows/app.yml'] }
  workflow_dispatch:
permissions:
  contents: write   # publishes releases (APK for phones' automatic update, web build for Hostinger)
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
env:
  FLUTTER_VERSION: '3.38.10'
  # Public HTTPS URL of the API (repository variable, not a secret — it ships in the app anyway)
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  # Mirror (Cloudflare Worker forwarding to the API) tried first: some mobile networks block or throttle host domains
  API_MIRROR_URLS: https://value-attendance-api.peter-bakheet-uae.workers.dev
  # Firebase client config for phone push — public by design (it ships inside every app; not a secret).
  # The server-side key (FCM_SERVICE_ACCOUNT) lives only in Netlify's environment.
  FIREBASE_DEFINES: >-
    --dart-define=FIREBASE_API_KEY=AIzaSyBpuGxRAmut3r_mCMtvdtqYMlnW3uNNvHY
    --dart-define=FIREBASE_APP_ID=1:1055799246852:android:1f3156a362edc90023f551
    --dart-define=FIREBASE_SENDER_ID=1055799246852
    --dart-define=FIREBASE_PROJECT_ID=bustling-syntax-480805-k4
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Generate platform folders (first run only)
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --org com.jph.valueattendance --project-name jph_real_estate_hr .
          fi
          dart run tool/patch_android.dart
          echo "--- release manifest permissions ---"; grep -n "uses-permission\|<application" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Analyze (errors fail; original JPH screens keep their lint warnings)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt; grep -E "^\s*error •" analyze.txt | head -200; ! grep -qE "^\s*error •" analyze.txt
      - run: flutter test
      - name: API URL check
        run: |
          if [ -z "$API_BASE_URL" ]; then
            # Public API URL (not a secret). Override with the repository variable API_BASE_URL if it moves.
            echo "API_BASE_URL=https://value-attendance.vercel.app" >> "$GITHUB_ENV"
          fi
      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS
      - name: Start the first-screen files early (preload) instead of one after another
        run: |
          # Fetched right away while main.dart.js is still being prepared; no cache rule changes, so updates stay instant.
          # crossorigin="anonymous" = the same request mode Flutter's own fetch uses, so the preloaded copy is reused.
          python3 - <<'PY'
          import os
          files = ['assets/AssetManifest.bin.json', 'assets/FontManifest.json', 'assets/fonts/MaterialIcons-Regular.otf',
                   'assets/assets/fonts/Cairo-Regular.ttf', 'assets/assets/fonts/Cairo-SemiBold.ttf', 'assets/assets/fonts/Cairo-Bold.ttf',
                   'assets/assets/fonts/NotoFlags.ttf', 'assets/assets/l10n/ar.json', 'assets/assets/l10n/en.json',
                   'assets/assets/jph_l10n/ar.json', 'assets/assets/bg/dark_bg.webp', 'assets/assets/images/logo.png']
          files = [f for f in files if os.path.exists('build/web/' + f)]
          tags = ''.join(f'  <link rel="preload" href="{f}" as="fetch" crossorigin="anonymous">\n' for f in files)
          p = 'build/web/index.html'; s = open(p).read()
          assert '</head>' in s and 'rel="preload"' not in s
          open(p, 'w').write(s.replace('</head>', tags + '</head>', 1))
          print(tags)
          PY
      - name: Trial — skwasm renderer build in value-attendance/_test/ (measured only; the live app is unchanged)
        continue-on-error: true
        run: |
          rm -rf /tmp/webmain && cp -r build/web /tmp/webmain
          flutter build web --release --wasm --base-href /value-attendance/_test/ --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS
          rm -rf build/wasm-test && cp -r build/web build/wasm-test
          rm -rf build/web && cp -r /tmp/webmain build/web
          (cd build/wasm-test && zip -qr ../../value-attendance-web-wasm-test.zip .) && ls -la value-attendance-web-wasm-test.zip
      - name: Hostinger copy of the web build (+ its own folder-only .htaccess) and validation
        run: |
          rm -rf build/hostinger && cp -r build/web build/hostinger
          cp deploy/hostinger/.htaccess build/hostinger/.htaccess
          # the build must be complete and point at /value-attendance/ before anything is uploaded
          for f in index.html flutter_bootstrap.js main.dart.js assets/AssetManifest.bin.json assets/assets/bg/dark_bg.webp; do
            test -s "build/hostinger/$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q '<base href="/value-attendance/">' build/hostinger/index.html || { echo "::error::wrong base href"; exit 1; }
          # nothing secret may ship in the public folder
          if find build/hostinger -name '*.env' -o -name '*.p12' -o -name '*.jks' -o -name 'key.properties' | grep -q .; then echo "::error::secret file in build"; exit 1; fi
          du -sh build/hostinger; find build/hostinger -type f -size +300k -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with: { name: hostinger-web, path: app/build/hostinger, include-hidden-files: true, retention-days: 14 }
      - name: Release signing key (kept only in repository secrets — never in the code)
        env:
          KEY_PASS: '${{ secrets.ANDROID_KEY_PASS }}'
          KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}'
        run: |
          if [ -z "$KEY_PASS" ] || [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS secrets not set — APK stays debug-signed and no Android update is published"; exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEY_PASS" >/dev/null || { echo "::error::keystore or password is wrong"; exit 1; }
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEY_PASS" | awk -F, '/PrivateKeyEntry/{print $1; exit}')
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.p12" "$KEY_PASS" "$ALIAS" "$KEY_PASS" > android/key.properties
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: Build Android APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS $FIREBASE_DEFINES
      - name: Publish the update (the app downloads the newest release by itself)
        # the web-only pre-release never needs the Android key; an Android ([apk]) release does
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}', COMMIT_MSG: '${{ github.event.head_commit.message }}' }
        run: |
          V=1.0.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk value-attendance.apk
          # the same web build for jaurea.com/value-attendance/ (public files only: the app that already ships to every browser)
          (cd build/hostinger && zip -qr ../../value-attendance-web.zip .)
          EXTRA=""; [ -f value-attendance-web-wasm-test.zip ] && EXTRA=value-attendance-web-wasm-test.zip
          # Phones update themselves from the *latest* release. A new Android version is published only when the commit
          # message says [apk]; otherwise the web build goes out as a pre-release (phones ignore pre-releases).
          WANT_APK=0; printf '%s' "$COMMIT_MSG" | head -n1 | grep -q '\[apk\]' && WANT_APK=1
          # without the signing key an Android update is never published (phones would refuse it); the web still goes out
          if [ "$WANT_APK" = "1" ] && [ "$SIGNED" != "1" ]; then
            echo "::warning::[apk] asked but the ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS secrets are not set — web only, no Android update"; WANT_APK=0
          fi
          if [ "$WANT_APK" = "1" ]; then
            gh release create "v$V" value-attendance.apk value-attendance-web.zip $EXTRA --title "Value Attendance $V" --notes "تحديث تلقائي للتطبيق" --latest
          else
            gh release create "web-$V" value-attendance-web.zip $EXTRA --title "Web build $V (no Android update)" --notes "نسخة الويب فقط" --prerelease
          fi
      - uses: actions/upload-artifact@v4
        with: { name: value-attendance-apk, path: app/build/app/outputs/flutter-apk/app-release.apk, retention-days: 30 }
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  # Copy of the web app on Hostinger: https://jaurea.com/value-attendance/ (GitHub Pages stays as the fallback).
  # Uploads ONLY into the FTP account's own folder (an FTP account restricted to public_html/value-attendance);
  # it refuses to run if that folder looks like the WordPress root. Credentials live only in repository secrets,
  # and the connection is encrypted (FTPS) with full certificate checks.
  hostinger:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
      FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
      FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
    steps:
      - name: Secrets present?
        id: s
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::warning::HOSTINGER_FTP_* secrets not set — Hostinger upload skipped"; echo "go=0" >> "$GITHUB_OUTPUT"
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.s.outputs.go == '1'
        with: { name: hostinger-web, path: web }
      - name: Upload to public_html/value-attendance/ only
        if: steps.s.outputs.go == '1'
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y lftp >/dev/null
          test -s web/index.html && test -s web/.htaccess
          printf 'set ftp:ssl-force yes\nset ftp:ssl-protect-data yes\nset net:max-retries 3\nset net:timeout 30\nset cmd:fail-exit yes\n' > ~/.lftprc
          # 1) safety: this account's folder must not be the WordPress / hosting root
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "cls -1a; bye" > listing.txt
          if grep -qxE '(\./)?(wp-config\.php|wp-admin/?|wp-content/?|wp-includes/?|public_html/?|domains/?)' listing.txt; then
            echo "::error::The FTP account opens the WordPress / hosting root, not public_html/value-attendance. Nothing was uploaded."; exit 1
          fi
          # 2) everything except the two entry files (the running app keeps working meanwhile), 3) the entry files last
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            mirror -R --delete --parallel=4 --exclude-glob index.html --exclude-glob flutter_bootstrap.js web/ ./;
            put -O ./ web/flutter_bootstrap.js;
            put -O ./ web/index.html;
            bye"
      - name: Check jaurea.com (WordPress unchanged) and the app
        if: steps.s.outputs.go == '1'
        run: |
          sleep 5
          code() { curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$1"; }
          for u in https://jaurea.com/ https://www.jaurea.com/; do c=$(code $u); echo "$u -> $c"; [ "$c" = 200 ] || { echo "::error::$u -> $c"; exit 1; }; done
          curl -sL --max-time 30 https://jaurea.com/ | grep -q 'wp-content' || { echo "::error::WordPress home page looks different"; exit 1; }
          curl -s --max-time 30 https://jaurea.com/value-attendance/ | grep -q '<base href="/value-attendance/">' || { echo "::error::app index not served"; exit 1; }
          for f in flutter_bootstrap.js main.dart.js assets/AssetManifest.bin.json assets/assets/bg/dark_bg.webp assets/assets/sounds/notification.mp3; do
            c=$(code "https://jaurea.com/value-attendance/$f"); echo "$f -> $c"; [ "$c" = 200 ] || { echo "::error::$f -> $c"; exit 1; }
          done
          echo "--- headers"; curl -sI --max-time 30 https://jaurea.com/value-attendance/main.dart.js | grep -iE 'cache-control|content-encoding|content-type' || true
          curl -sI --max-time 30 https://jaurea.com/value-attendance/assets/assets/bg/dark_bg.webp | grep -iE 'cache-control|content-type' || true
          echo "--- deep link"; c=$(code "https://jaurea.com/value-attendance/some/inner/page"); echo "$c"; [ "$c" = 200 ] || exit 1
