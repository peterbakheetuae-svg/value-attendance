name: App — test, Web + Android + Windows, one release to Hostinger (jaurea.com/valunivo)
on:
  push: { branches: [main], paths: ['app/**', '.github/workflows/app.yml'] }
  workflow_dispatch:
# ONE release = one version (1.0.<run number>) for all three: Web, Android APK, Windows EXE.
#  build (Web + APK) ─┐
#  windows (EXE)  ────┴─► release-files (signs the Windows manifest, checks all versions match)
#                          └─► hostinger (validates everything on the server first, then publishes; verifies all three live)
#                               └─► github-release (permanent copy of every file; only after everything above passed)
# If any build or check fails, nothing after it runs: no partial release, the previous one stays live.
permissions:
  contents: write   # keeps a copy of each release (permanent backup); the live app and its updates are on Hostinger
# a release in progress is never cancelled half-way (a newer push waits for it)
concurrency: { group: app-build, cancel-in-progress: false }
env:
  FLUTTER_VERSION: '3.38.10'
  # Public HTTPS URL of the API (repository variable, not a secret — it ships in the app anyway)
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  # Mirror (Cloudflare Worker forwarding to the API) tried first: some mobile networks block or throttle host domains
  API_MIRROR_URLS: https://value-attendance-api.peter-bakheet-uae.workers.dev
  # Firebase client config for phone push — public by design (it ships inside every app; not a secret).
  # The server-side key (FCM_SERVICE_ACCOUNT) lives only in Netlify's environment.
  FIREBASE_DEFINES: >-
    --dart-define=FIREBASE_API_KEY=AIzaSyBpuGxRAmut3r_mCMtvdtqYMlnW3uNNvHY
    --dart-define=FIREBASE_APP_ID=1:1055799246852:android:1f3156a362edc90023f551
    --dart-define=FIREBASE_SENDER_ID=1055799246852
    --dart-define=FIREBASE_PROJECT_ID=bustling-syntax-480805-k4
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Generate platform folders (first run only)
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --org com.jph.valueattendance --project-name jph_real_estate_hr .
          fi
          dart run tool/patch_android.dart
          echo "--- release manifest permissions ---"; grep -n "uses-permission\|<application" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Analyze (errors fail; original JPH screens keep their lint warnings)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt; grep -E "^\s*error •" analyze.txt | head -200; ! grep -qE "^\s*error •" analyze.txt
      - run: flutter test
      - name: API URL check
        run: |
          if [ -z "$API_BASE_URL" ]; then
            # Public API URL (not a secret). Override with the repository variable API_BASE_URL if it moves.
            echo "API_BASE_URL=https://valunivo.vercel.app" >> "$GITHUB_ENV"
          fi
      - name: Build Web (WebAssembly — faster; browsers without it get the JavaScript build automatically)
        run: flutter build web --release --wasm --base-href "/valunivo/" --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS
      - name: Web Push (notifications for the web app on iPhone / browsers) — its worker + helper next to the app
        run: |
          cp web_push/push-sw.js web_push/va-push.js build/web/
          python3 - <<'PY'
          p = 'build/web/index.html'; s = open(p).read()
          assert '</head>' in s and 'va-push.js' not in s
          open(p, 'w').write(s.replace('</head>', '  <script src="va-push.js" defer></script>\n</head>', 1))
          PY
          grep -q 'va-push.js' build/web/index.html
      - name: The start of loading — the orbiting logo until the app's first frame
        run: |
          python3 - <<'PY'
          p = 'build/web/index.html'; s = open(p).read()
          loader = open('web_loader/loader.html').read()
          assert '<body>' in s and 'va-loader' not in s
          open(p, 'w').write(s.replace('<body>', '<body>\n' + loader, 1))
          PY
          grep -q 'va-loader' build/web/index.html
      - name: Start the first-screen files early (preload) instead of one after another
        run: |
          # Fetched right away while main.dart.js is still being prepared; no cache rule changes, so updates stay instant.
          # crossorigin="anonymous" = the same request mode Flutter's own fetch uses, so the preloaded copy is reused.
          python3 - <<'PY'
          import os
          files = ['assets/AssetManifest.bin.json', 'assets/FontManifest.json', 'assets/fonts/MaterialIcons-Regular.otf',
                   'assets/assets/fonts/Cairo-Regular.ttf', 'assets/assets/fonts/Cairo-SemiBold.ttf', 'assets/assets/fonts/Cairo-Bold.ttf',
                   'assets/assets/fonts/NotoFlags.ttf', 'assets/assets/l10n/ar.json', 'assets/assets/l10n/en.json',
                   'assets/assets/jph_l10n/ar.json', 'assets/assets/bg/site_backdrop.jpeg', 'assets/assets/images/logo_letter.png', 'assets/assets/images/logo_orbit.png']
          files = [f for f in files if os.path.exists('build/web/' + f)]
          tags = ''.join(f'  <link rel="preload" href="{f}" as="fetch" crossorigin="anonymous">\n' for f in files)
          p = 'build/web/index.html'; s = open(p).read()
          assert '</head>' in s and 'rel="preload"' not in s
          open(p, 'w').write(s.replace('</head>', tags + '</head>', 1))
          print(tags)
          PY
      - name: Hostinger copy of the web build (+ its own folder-only .htaccess) and validation
        run: |
          rm -rf build/hostinger && cp -r build/web build/hostinger
          cp deploy/hostinger/.htaccess build/hostinger/.htaccess
          # the build must be complete and point at /valunivo/ before anything is uploaded
          for f in index.html flutter_bootstrap.js main.dart.js assets/AssetManifest.bin.json assets/assets/bg/dark_bg.webp push-sw.js va-push.js; do
            test -s "build/hostinger/$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q '<base href="/valunivo/">' build/hostinger/index.html || { echo "::error::wrong base href"; exit 1; }
          # nothing secret may ship in the public folder
          if find build/hostinger -name '*.env' -o -name '*.p12' -o -name '*.jks' -o -name 'key.properties' | grep -q .; then echo "::error::secret file in build"; exit 1; fi
          du -sh build/hostinger; find build/hostinger -type f -size +300k -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with: { name: hostinger-web, path: app/build/hostinger, include-hidden-files: true, retention-days: 14 }
      - name: Release signing key (kept only in repository secrets — never in the code)
        env:
          KEY_PASS: '${{ secrets.ANDROID_KEY_PASS }}'
          KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}'
        run: |
          if [ -z "$KEY_PASS" ] || [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS secrets not set — APK stays debug-signed and no Android update is published"; exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          # a wrong key / password never blocks the web: the APK just is not published (and the build says why)
          if ! keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEY_PASS" >/dev/null 2>&1; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS do not match (wrong password or a broken copy of the key) — no Android update this time"; rm -f "$RUNNER_TEMP/release.p12"; exit 0
          fi
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEY_PASS" | awk -F, '/PrivateKeyEntry/{print $1; exit}')
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.p12" "$KEY_PASS" "$ALIAS" "$KEY_PASS" > android/key.properties
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: Build Android APK (every release — same version as Web and Windows)
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=API_MIRROR_URLS=$API_MIRROR_URLS $FIREBASE_DEFINES
      - name: Release files — Web + Android (published only after the Windows build passes too)
        if: github.ref == 'refs/heads/main'
        run: |
          V=1.0.${{ github.run_number }}
          # an Android update is part of every release: never without the release signing key (phones would refuse it)
          [ "$SIGNED" = "1" ] || { echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS missing or wrong — release stopped (nothing published)"; exit 1; }
          test -s build/app/outputs/flutter-apk/app-release.apk || { echo "::error::APK missing"; exit 1; }
          grep -q "\"version\":\"$V\"" build/hostinger/version.json || { echo "::error::web version.json is not $V"; cat build/hostinger/version.json; exit 1; }
          mkdir -p ../deploy-out/android
          (cd build/hostinger && zip -qr ../../../deploy-out/web.zip .)
          cp build/app/outputs/flutter-apk/app-release.apk "../deploy-out/android/value-attendance-$V.apk"
          SIZE=$(stat -c%s ../deploy-out/android/value-attendance-$V.apk); SHA=$(sha256sum ../deploy-out/android/value-attendance-$V.apk | cut -d' ' -f1)
          # same latest.json format the Android app already reads (unchanged)
          printf '{"version":"%s","build":%s,"apk":"value-attendance-%s.apk","size":%s,"sha256":"%s"}\n' "$V" "${{ github.run_number }}" "$V" "$SIZE" "$SHA" > ../deploy-out/android/latest.json
          cat ../deploy-out/android/latest.json; ls -la ../deploy-out ../deploy-out/android
      - uses: actions/upload-artifact@v4
        with: { name: value-attendance-apk, path: app/build/app/outputs/flutter-apk/app-release.apk, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: deploy-out, path: deploy-out, retention-days: 7 }

  # Windows app + installer, same version (windows.yml, also used on its own for feature-branch tests).
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      build_number: '${{ github.run_number }}'
      release: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  # Signs the Windows update manifest and checks that Web, Android and Windows carry the same version.
  release-files:
    needs: [build, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: app/tool/release }
      - uses: actions/download-artifact@v4
        with: { name: deploy-out, path: out }
      - uses: actions/download-artifact@v4
        with: { name: windows-out, path: win }
      - name: Sign the Windows update manifest (Ed25519 release key from the repository secrets)
        env: { SIGNING_KEY: '${{ secrets.WINDOWS_UPDATE_SIGNING_KEY }}' }
        run: |
          V=1.0.${{ github.run_number }}; N=${{ github.run_number }}
          [ -n "$SIGNING_KEY" ] || { echo "::error::WINDOWS_UPDATE_SIGNING_KEY missing"; exit 1; }
          umask 077; printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/k.pem"
          PUB=$(bash app/tool/release/public_key.sh "$RUNNER_TEMP/k.pem")
          # the app was compiled with this exact public key — otherwise it would refuse the manifest
          [ "$PUB" = "${{ needs.windows.outputs.public_key }}" ] || { rm -f "$RUNNER_TEMP/k.pem"; echo "::error::signing key does not match the key compiled into the Windows build"; exit 1; }
          mkdir -p out/windows
          cp "win/VALUNIVO-Setup-$V.exe" out/windows/
          bash app/tool/release/sign_windows_manifest.sh "$RUNNER_TEMP/k.pem" "out/windows/VALUNIVO-Setup-$V.exe" "$V" "$N" out/windows/latest.json
          rm -f "$RUNNER_TEMP/k.pem"
          # for the server-side check before publishing (not served)
          echo "VALUNIVO-Setup-$V.exe $(sha256sum out/windows/VALUNIVO-Setup-$V.exe | cut -d' ' -f1)" > out/windows/release.txt
          cat out/windows/latest.json
      - name: Same version everywhere
        run: |
          V=1.0.${{ github.run_number }}
          W=$(unzip -p out/web.zip version.json); A=$(cat out/android/latest.json); X=$(cat out/windows/latest.json)
          echo "web: $W"; echo "android: $A"; echo "windows: $X"
          python3 - "$V" <<'PY2'
          import json, sys, zipfile
          v = sys.argv[1]
          web = json.loads(zipfile.ZipFile('out/web.zip').read('version.json'))['version']
          android = json.load(open('out/android/latest.json'))['version']
          windows = json.loads(json.load(open('out/windows/latest.json'))['manifest'])['version']
          print('web', web, '| android', android, '| windows', windows)
          sys.exit(0 if web == android == windows == v else '::error::versions differ — release stopped')
          PY2
          [ "${{ needs.windows.outputs.version }}" = "$V" ] || { echo "::error::Windows build is ${{ needs.windows.outputs.version }}"; exit 1; }
          echo "release $V: web + android + windows"
      - uses: actions/upload-artifact@v4
        with: { name: release-out, path: out, retention-days: 30 }

  # The live app: https://jaurea.com/valunivo/ (+ /android/ for phone updates; the old /value-attendance/ redirects there and keeps its /android/ for phones on older versions). Sent over SSH (encrypted,
  # server key pinned below) and placed by app/deploy/hostinger/remote-deploy.sh into public_html/valunivo/ (+ the old public_html/value-attendance/)
  # ONLY — WordPress is fingerprinted before / after and the deploy fails if anything there changed.
  # Needs ONE repository secret: HOSTINGER_SSH_KEY (private key whose public half is added in hPanel → SSH Access)
  # or HOSTINGER_SSH_PASSWORD. Without it the step is skipped and the build is copied over by hand.
  hostinger:
    needs: [release-files, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 82.198.227.7
      SSH_PORT: '65002'
      SSH_USER: u258219607
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
    steps:
      - name: Secret present?
        id: s
        run: |
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASS" ]; then
            echo "::error::HOSTINGER_SSH_KEY / HOSTINGER_SSH_PASSWORD not set — release cannot be published"; exit 1
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.go == '1'
        with: { sparse-checkout: app/deploy/hostinger }
      - uses: actions/download-artifact@v4
        if: steps.s.outputs.go == '1'
        with: { name: release-out, path: out }
      - name: Copy to the server and deploy
        if: steps.s.outputs.go == '1'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # the server's own keys — the connection is refused if anything else answers
          cat > ~/.ssh/known_hosts <<'KH'
          [82.198.227.7]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINIEVbKu9K7AVrGNwujYEUbrw0wvECMboXFOKfpiiw3h
          [82.198.227.7]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCHeIP4sUl5WiCE5CU68sEpg0WFGfq/jyVGW0RqVzi3v56HYIJhINFOZvD3XxttLN/k7t2ZEjA52H73cegg6QGY=
          KH
          sed -i 's/^ *//' ~/.ssh/known_hosts
          OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -P $SSH_PORT"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            SCP="scp $OPTS -i $HOME/.ssh/deploy"; SSH="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT -i $HOME/.ssh/deploy"
          else
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y sshpass >/dev/null
            export SSHPASS="$SSH_PASS"
            SCP="sshpass -e scp $OPTS"; SSH="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT"
          fi
          $SSH "$SSH_USER@$SSH_HOST" 'rm -rf ~/va-staging && mkdir -p ~/va-staging/android ~/va-staging/windows'
          $SCP out/web.zip "$SSH_USER@$SSH_HOST:va-staging/web.zip"
          $SCP out/android/* "$SSH_USER@$SSH_HOST:va-staging/android/"
          $SCP out/windows/* "$SSH_USER@$SSH_HOST:va-staging/windows/"
          $SSH "$SSH_USER@$SSH_HOST" 'bash -s' < app/deploy/hostinger/remote-deploy.sh
      - name: Check jaurea.com (WordPress unchanged) and the app
        if: steps.s.outputs.go == '1'
        run: |
          sleep 5
          code() { curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$1"; }
          for u in https://jaurea.com/ https://www.jaurea.com/; do c=$(code $u); echo "$u -> $c"; [ "$c" = 200 ] || { echo "::error::$u -> $c"; exit 1; }; done
          curl -sL --max-time 30 https://jaurea.com/ | grep -q 'wp-content' || { echo "::error::WordPress home page looks different"; exit 1; }
          curl -s --max-time 30 https://jaurea.com/valunivo/ | grep -q '<base href="/valunivo/">' || { echo "::error::app index not served"; exit 1; }
          # the old address sends people to the new one
          curl -sL --max-time 30 https://jaurea.com/value-attendance/ | grep -q '<base href="/valunivo/">' || { echo "::error::old address does not redirect"; exit 1; }
          for f in flutter_bootstrap.js main.dart.js assets/AssetManifest.bin.json assets/assets/bg/dark_bg.webp; do
            c=$(code "https://jaurea.com/valunivo/$f"); echo "$f -> $c"; [ "$c" = 200 ] || { echo "::error::$f -> $c"; exit 1; }
          done
          V=1.0.${{ github.run_number }}
          # Web: the live build is this release
          curl -s --max-time 30 "https://jaurea.com/valunivo/version.json?t=$(date +%s)" | tee /dev/stderr | grep -q "\"version\":\"$V\"" || { echo "::error::web version.json is not $V"; exit 1; }
          # Android: the same latest.json + APK the phones already read (new and old address)
          for d in valunivo value-attendance; do
            curl -s --max-time 30 "https://jaurea.com/$d/android/latest.json?t=$(date +%s)" | tee /dev/stderr | grep -q "\"version\":\"$V\"" || { echo "::error::$d/android/latest.json not updated"; exit 1; }
          done
          curl -s --max-time 300 -o apk.bin "https://jaurea.com/valunivo/android/value-attendance-$V.apk"
          [ "$(sha256sum apk.bin | cut -d' ' -f1)" = "$(sed -n 's/.*"sha256":"\([0-9a-f]*\)".*/\1/p' out/android/latest.json)" ] || { echo "::error::live APK hash differs"; exit 1; }
          # Windows: the live manifest verifies with the key compiled into the app, and the live installer matches it
          curl -s --max-time 30 -o live.json "https://jaurea.com/valunivo/windows/latest.json?t=$(date +%s)"
          python3 - "$V" "${{ needs.windows.outputs.public_key }}" <<'PY2'
          import base64, json, subprocess, sys, tempfile, os
          v, pub = sys.argv[1], base64.b64decode(sys.argv[2])
          env = json.load(open('live.json')); text = env['manifest'].encode(); sig = base64.b64decode(env['sig'])
          d = tempfile.mkdtemp()
          # raw Ed25519 public key → SubjectPublicKeyInfo DER for openssl
          open(f'{d}/pub.der', 'wb').write(bytes.fromhex('302a300506032b6570032100') + pub)
          open(f'{d}/m', 'wb').write(text); open(f'{d}/s', 'wb').write(sig)
          subprocess.run(['openssl', 'pkeyutl', '-verify', '-pubin', '-keyform', 'DER', '-inkey', f'{d}/pub.der', '-rawin', '-in', f'{d}/m', '-sigfile', f'{d}/s'], check=True)
          m = json.loads(text)
          assert m['version'] == v, m
          open('win.txt', 'w').write(f"{m['installer']} {m['sha256']} {m['size']}")
          print('windows manifest verified:', m)
          PY2
          read NAME SHA SIZE < win.txt
          curl -s --max-time 300 -o win.bin "https://jaurea.com/valunivo/windows/$NAME"
          [ "$(sha256sum win.bin | cut -d' ' -f1)" = "$SHA" ] && [ "$(stat -c%s win.bin)" = "$SIZE" ] || { echo "::error::live Windows installer does not match the signed manifest"; exit 1; }
          echo "LIVE: web $V, android $V, windows $V — all verified"

  # Permanent copy of every file of this release (GitHub releases do not expire like build artifacts).
  # Created last: a release that exists here is complete and live. An existing tag is never overwritten.
  github-release:
    needs: hostinger
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-out, path: out }
      - uses: actions/download-artifact@v4
        with: { name: windows-out, path: win }
      - run: |
          V=1.0.${{ github.run_number }}
          cp out/web.zip value-attendance-web.zip
          cp "out/android/value-attendance-$V.apk" value-attendance.apk
          cp out/android/latest.json android-latest.json
          cp out/windows/latest.json windows-latest.json
          gh release create "v$V" -R "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "VALUNIVO $V" --notes "تحديث VALUNIVO $V — الويب + أندرويد + ويندوز (نفس النسخة)" \
            value-attendance.apk value-attendance-web.zip android-latest.json windows-latest.json \
            "win/VALUNIVO-Setup-$V.exe" "win/VALUNIVO-$V-windows-x64.zip"
