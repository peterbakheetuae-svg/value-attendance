# Preview of the waiting changes (pending-build) BEFORE they go to jaurea.com:
#   https://<owner>.github.io/value-attendance/  — GitHub Pages (needs the repository public + Pages source «GitHub Actions»)
# It talks to the PREVIEW API only (repository variable PREVIEW_API_URL — the Vercel preview of pending-build, which
# runs on its own demo database). Without PREVIEW_API_URL nothing is published, so a preview never touches real data.
name: Preview (GitHub Pages, demo data)
on:
  push: { branches: [pending-build], paths: ['app/**', '.github/workflows/preview.yml'] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: preview-pages, cancel-in-progress: true }
jobs:
  build:
    if: vars.PREVIEW_API_URL != ''
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.38.10', channel: stable, cache: true }
      - name: Platform folders
        run: |
          if [ ! -d web ]; then flutter create --platforms=web --org com.jph.valueattendance --project-name jph_real_estate_hr .; fi
      - run: flutter pub get
      - name: Build Web against the preview API (demo data)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_BASE_URL=${{ vars.PREVIEW_API_URL }}
      - name: Web Push helper + SPA fallback + a clear «معاينة» title
        run: |
          cp web_push/push-sw.js web_push/va-push.js build/web/
          python3 - <<'PY'
          p = 'build/web/index.html'; s = open(p).read()
          s = s.replace('</head>', '  <script src="va-push.js" defer></script>\n</head>', 1)
          s = s.replace('<title>', '<title>معاينة — ', 1)
          open(p, 'w').write(s)
          PY
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
          if find build/web -name '*.env' -o -name '*.p12' -o -name '*.jks' -o -name 'key.properties' | grep -q .; then echo "::error::secret file in build"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
