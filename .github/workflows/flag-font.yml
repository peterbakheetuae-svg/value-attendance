name: One-off — make the small flag font (NotoFlags.ttf)
# Builds a tiny subset of Google's Noto Color Emoji (SIL OFL 1.1) holding only the flags shown on the
# login / language screens, so the browser no longer downloads the whole 693 KB emoji font for them.
on:
  push: { branches: [pending-build], paths: ['.github/workflows/flag-font.yml'] }
permissions: { contents: write }
jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: pending-build }
      - run: |
          pip install -q fonttools==4.55.3 brotli
          curl -sSL --fail -o /tmp/NotoColorEmoji.ttf https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.047/fonts/NotoColorEmoji.ttf
          curl -sSL --fail -o app/assets/fonts/NotoFlags-OFL.txt https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.047/fonts/LICENSE
          # exactly the 4 flags + globe: find each flag's ligature glyph in GSUB, keep only those (no closure)
          cat > /tmp/sub.py <<'PY'
          from fontTools.ttLib import TTFont
          from fontTools import subset
          src = TTFont('/tmp/NotoColorEmoji.ttf'); cmap = src.getBestCmap()
          ri = lambda ch: cmap[0x1F1E6 + ord(ch) - ord('A')]
          want = [(ri(a), ri(b)) for a, b in ['SA', 'US', 'PK', 'IN']]
          found = {}
          for lk in src['GSUB'].table.LookupList.Lookup:
              for st in lk.SubTable:
                  st = getattr(st, 'ExtSubTable', st)
                  for first, ligs in getattr(st, 'ligatures', {}).items():
                      for lg in ligs:
                          seq = (first, *lg.Component)
                          if seq in want: found[seq] = lg.LigGlyph
          assert len(found) == 4, found
          keep = sorted(set(found.values()) | {g for s in want for g in s} | {cmap[0x1F310]})
          print('keep', keep)
          opt = subset.Options(); opt.layout_closure = False; opt.layout_features = ['*']
          sub = subset.Subsetter(opt); sub.populate(glyphs=keep); sub.subset(src)
          src.save('app/assets/fonts/NotoFlags.ttf')
          PY
          python3 /tmp/sub.py
          ls -la app/assets/fonts/NotoFlags.ttf
          git add -A app/assets/fonts; git status --short
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Smaller flag font: exactly SA, US, PK, IN + globe" && git push origin HEAD:pending-build
