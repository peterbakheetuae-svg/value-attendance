name: API tests
on:
  push: { paths: ['api/**', 'db/**', '.github/workflows/api-ci.yml'] }
  pull_request: { paths: ['api/**', 'db/**'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    # 16 = today's CI; 18 = the Frankfurt (EU) Neon projects the system moves to — the whole chain and suite on both
    strategy: { fail-fast: false, matrix: { pg: ['16', '18'] } }
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_PASSWORD: ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: npm ci --include=dev
      # supply chain: the packages that ship (no dev tools) may carry no known high / critical advisory
      - name: Dependency audit (production packages, high and critical)
        if: matrix.pg == '18'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
        env: { TEST_PG_URL: 'postgres://postgres:ci@localhost:5432/postgres' }
      # the same suite with the API connected as a least-privilege runtime role (no CREATE / TRUNCATE, DELETE on the
      # runtime tables only, audit_log append-only) — proves the production role grants are sufficient
      - name: npm test (least-privilege runtime role)
        # the TRUNCATE-based data reset is expected to be refused under this role (covered by least-privilege.test.ts)
        run: node --import tsx --test --test-concurrency=4 --test-skip-pattern="owner only; dry run changes nothing" test/*.test.ts
        env: { TEST_PG_URL: 'postgres://postgres:ci@localhost:5432/postgres', TEST_APP_ROLE: '1' }
