name: Cloudflare — traffic, CPU probe, isolated gateway staging (workers.dev only, never production)

# Runs only for the migration branch. Nothing here talks to Vercel, Neon or any production host.
# Repository secrets: CLOUDFLARE_ACCOUNT_ID;
#   CLOUDFLARE_ANALYTICS_TOKEN — Account Analytics: Read only (traffic job; deploys nothing);
#   CLOUDFLARE_API_TOKEN — Workers Scripts: Edit + Account Analytics: Read (temporary probe / staging Workers + cleanup).
# Repository variables: CF_MIRROR_SCRIPT (traffic report), CF_GATEWAY_STAGING=on (isolated staging).
# Staging = gateway → synthetic verifier Worker (Service Binding). Its gateway secrets are generated per run, never
# printed, and both Workers are deleted at the end of the run.
on:
  push:
    branches: [cloudflare/worker-migration]
    paths: ['api/**', '.github/workflows/cloudflare-staging.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: cloudflare-staging, cancel-in-progress: false }

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  traffic:
    # read-only analytics of the EXISTING production mirror Worker: request counts only (no URLs, no bodies)
    if: github.ref == 'refs/heads/cloudflare/worker-migration' && vars.CF_MIRROR_SCRIPT != ''
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secrets present?
        env: { ANALYTICS_TOKEN: '${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}' }
        run: |
          if [ -z "$ANALYTICS_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_ANALYTICS_TOKEN / CLOUDFLARE_ACCOUNT_ID not set"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: 'Mirror Worker — requests per day, 14 days (Account Analytics Read only)'
        if: env.SKIP != '1'
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}' }
        run: |
          node cloudflare/cf-check.mjs traffic "${{ vars.CF_MIRROR_SCRIPT }}" 14
          node cloudflare/cf-check.mjs cpu "${{ vars.CF_MIRROR_SCRIPT }}" "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" || true

  cpu-probe:
    if: github.ref == 'refs/heads/cloudflare/worker-migration'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secrets present?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Repository secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet — nothing deployed"
            echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - run: npm install --no-audit --no-fund
        if: env.SKIP != '1'
      - name: Deploy throwaway probe (no DB, no secrets)
        if: env.SKIP != '1'
        run: |
          npx --yes wrangler@4 deploy -c cloudflare/wrangler.probe.jsonc | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::no workers.dev URL — enable the workers.dev subdomain for the account"; exit 1; }
          echo "PROBE_URL=$URL" >> "$GITHUB_ENV"
          echo "FROM=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Call it (5 × noop, 40 × password check)
        if: env.SKIP != '1'
        run: |
          sleep 10
          for i in $(seq 5);  do curl -s -o /dev/null -w '%{http_code} ' "$PROBE_URL/noop"; done; echo
          for i in $(seq 40); do curl -s -o /tmp/v.out -w '%{http_code} ' "$PROBE_URL/verify"; done; echo
          echo "last /verify body: $(head -c 200 /tmp/v.out)"
      - name: CPU time from Cloudflare analytics
        if: env.SKIP != '1'
        run: |
          for i in $(seq 12); do
            sleep 60
            if node cloudflare/cf-check.mjs cpu valunivo-cpu-probe "$FROM"; then exit 0; fi
          done
          echo "::warning::analytics not available yet — check Workers & Pages → valunivo-cpu-probe → Metrics"
      - name: Delete the probe
        if: always() && env.SKIP != '1'
        run: npx --yes wrangler@4 delete -c cloudflare/wrangler.probe.jsonc --force || true

  staging:
    if: github.ref == 'refs/heads/cloudflare/worker-migration' && vars.CF_GATEWAY_STAGING == 'on'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secrets present?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_GATEWAY_STAGING=on but CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing — nothing deployed"; exit 1; fi
      - run: npm install --no-audit --no-fund
      - name: Isolation gate — no production upstream, no database, no routes, logs off
        run: |
          set -e
          for f in wrangler.jsonc cloudflare/wrangler.verifier.jsonc; do
            if grep -qiE 'vercel\.app|jaurea|valunivo\.|neon\.tech|postgres|DATABASE_URL|"hyperdrive"|"d1_databases"|"kv_namespaces"|"routes?"|"route"' "$f"; then
              echo "::error::$f references a production host, a database or a route"; exit 1; fi
            grep -q '"observability": { "enabled": false }' "$f" || { echo "::error::$f: Workers Logs must stay off"; exit 1; }
          done
          grep -q '"UPSTREAM": "https://verifier.staging.invalid"' wrangler.jsonc || { echo "::error::staging UPSTREAM must be the .invalid placeholder"; exit 1; }
          grep -q '"service": "valunivo-gw-verifier-staging"' wrangler.jsonc || { echo "::error::staging must bind to the synthetic verifier"; exit 1; }
          node --import tsx --test test/gateway.test.ts
      - name: Deploy synthetic verifier, then the gateway (workers.dev only)
        run: |
          npx --yes wrangler@4 deploy -c cloudflare/wrangler.verifier.jsonc | tee /tmp/vf.log
          npx --yes wrangler@4 deploy | tee /tmp/gw.log
          echo "VF=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/vf.log | head -1)" >> "$GITHUB_ENV"
          echo "GW=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/gw.log | head -1)" >> "$GITHUB_ENV"
          echo "FROM=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Ephemeral gateway secret (generated here, never printed)
        run: |
          S1=$(openssl rand -base64 36 | tr '+/' '-_' | tr -d '=\n'); echo "::add-mask::$S1"
          printf '%s' "$S1" | npx --yes wrangler@4 secret put VA_GATEWAY_SECRET -c cloudflare/wrangler.verifier.jsonc >/dev/null
          printf '%s' "$S1" | npx --yes wrangler@4 secret put VA_GATEWAY_SECRET >/dev/null
          echo "S1=$S1" >> "$GITHUB_ENV"
          echo "MYIP=$(curl -4 -s https://api.ipify.org)" >> "$GITHUB_ENV"
          sleep 15
      - name: Checks — isolation, IP, body hash, timestamps, replay, direct bypass, failure behaviour
        run: S_CUR="$S1" NODE_OPTIONS=--dns-result-order=ipv4first node --import tsx cloudflare/staging-checks.mts main
      - name: Checks — secret rotation
        run: |
          S2=$(openssl rand -base64 36 | tr '+/' '-_' | tr -d '=\n'); echo "::add-mask::$S2"
          printf '%s' "$S2" | npx --yes wrangler@4 secret put VA_GATEWAY_SECRET -c cloudflare/wrangler.verifier.jsonc >/dev/null
          printf '%s' "$S1" | npx --yes wrangler@4 secret put VA_GATEWAY_SECRET_PREVIOUS -c cloudflare/wrangler.verifier.jsonc >/dev/null
          sleep 15
          S_CUR="$S2" node --import tsx cloudflare/staging-checks.mts rotation-overlap
          echo y | npx --yes wrangler@4 secret delete VA_GATEWAY_SECRET_PREVIOUS -c cloudflare/wrangler.verifier.jsonc >/dev/null
          sleep 15
          S_CUR="$S2" node --import tsx cloudflare/staging-checks.mts rotation-done
      - name: Gateway CPU analytics
        run: |
          for i in $(seq 6); do sleep 60; node cloudflare/cf-check.mjs cpu valunivo-gateway-staging "$FROM" && exit 0; done; true
      - name: Delete both staging Workers
        if: always()
        run: |
          npx --yes wrangler@4 delete --force || true
          npx --yes wrangler@4 delete -c cloudflare/wrangler.verifier.jsonc --force || true
