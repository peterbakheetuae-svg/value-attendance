name: Database migrations (manual, approved)

# Schema migrations run ONLY here, by hand, with the owner credential — never at Vercel build time with the runtime
# role (which has no CREATE). The secret MIGRATION_DATABASE_URL lives in the GitHub environment "production-db", which
# must have required reviewers, so every run waits for an explicit approval. Only db/migrations (never db/proposed).
on:
  workflow_dispatch:
    inputs:
      expect_database: { description: 'database name the URL must point at (safety check)', required: true, default: 'neondb' }
permissions: { contents: read }
concurrency: { group: db-migrate, cancel-in-progress: false }
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-db
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (= tag v7 on 2026-11-26)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (= tag v7 on 2026-11-26)
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Apply pending migrations (db/migrations only)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          EXPECT_DATABASE: ${{ inputs.expect_database }}
        run: |
          [ -n "$MIGRATION_DATABASE_URL" ] || { echo "::error::MIGRATION_DATABASE_URL missing in environment production-db"; exit 1; }
          npm run -s migrate
