name: jph_real_estate_hr
description: Value Attendance — HR attendance & sales-team management (Web + Android + Windows).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # the session token on Android: Android Keystore-backed storage (VA-04)
  flutter_secure_storage: ^11.2.0 # 10.x: its web part compiles to WebAssembly (9.x used dart:html); 11.x needs compileSdk 37
  # optional fingerprint / face / device-PIN lock over the saved session (2.x API: AuthenticationOptions)
  local_auth: ^3.0.2
  geolocator: ^14.1.2
  # in-shift follow-up keeps running with the app closed (foreground service with its own engine)
  flutter_background_service: ^5.1.0
  # first start: location (required), display over other apps, unrestricted battery
  permission_handler: ^13.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.1.2
  file_picker: ^13.4.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  file_saver: 0.7.0
  url_launcher: ^6.3.1
  # original JPH screens
  camera: ^0.12.2
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  audioplayers: ^6.4.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  flutter_local_notifications: ^23.0.4
  device_info_plus: ^13.3.0
  ota_update: ^7.0.2
  open_filex: ^5.0.0
  # reading .xlsx for the leads import (already pulled in by pdf)
  archive: ^4.0.10
  # Windows desktop app (VALUNIVO.exe) — Windows-only additions; Android / web builds do not use them:
  # the PC's webcam for «صوّر» / check-in selfie (camera does not include Windows by itself)
  camera_windows: ^0.3.1
  # hooks that webcam into ImagePicker's camera source (already pulled in by image_picker)
  image_picker_platform_interface: ^2.11.1
  # SHA-256 check of a downloaded Windows update before it runs (already pulled in by other packages)
  crypto: ^3.0.6
  pinenacl: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Windows CI smoke test (integration_test/) — test-only, never part of any app build
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bg/light_bg.webp
    - assets/bg/dark_bg.webp
    - assets/bg/site_backdrop.jpeg
    - assets/images/logo.png
    - assets/images/login_logo.png
    - assets/images/default_photo.jpg
    - assets/images/logo_letter.png
    - assets/images/logo_orbit.png
    - assets/avatar.png
    - assets/l10n/ar.json
    - assets/l10n/en.json
    - assets/jph_l10n/ar.json
    - assets/jph_l10n/en.json
    - assets/jph_l10n/hi.json
    - assets/jph_l10n/ur.json
    - assets/sounds/bell_sound.mp3
    - assets/sounds/notification.mp3
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
    # استمارات: custody receipt template v1 (page drawn from the approved original + field map) and its fonts
    - assets/forms/custody_receipt/v1/fields.json
    - assets/forms/custody_receipt/v1/template.png
    - assets/forms/laptop_receipt/v1/fields.json
    - assets/forms/laptop_receipt/v1/template.png
    - assets/forms/client_intro/v1/fields.json
    - assets/forms/client_intro/v1/template.png
    - assets/forms/reservation/value_group_logo.png
    - assets/fonts/forms/ValueFormNaskh-Regular.ttf
    - assets/fonts/forms/ArimoLatin-Regular.ttf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    # only the flags shown on the login / language screens (Noto Color Emoji subset, SIL OFL — see NotoFlags-OFL.txt);
    # saves the browser downloading the whole 693 KB emoji font for one flag
    - family: NotoFlags
      fonts:
        - asset: assets/fonts/NotoFlags.ttf

# image 4.11 (via pdf/printing) calls ZLibDecoder.decodeLazy, which archive 4.0.9 lacks.
# pub resolves archive 4.0.9 because image under-declares its constraint.
dependency_overrides:
  archive: ^4.0.10
