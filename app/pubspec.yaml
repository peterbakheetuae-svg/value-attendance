name: jph_real_estate_hr
description: Value Attendance — HR attendance & sales-team management (Web + Android).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  # first start: location (required), display over other apps, unrestricted battery
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  pdf: ^3.11.1
  printing: ^5.13.4
  file_saver: 0.2.14
  url_launcher: ^6.3.1
  # original JPH screens
  camera: ^0.11.1
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  audioplayers: ^6.4.0
  package_info_plus: ^8.3.0
  share_plus: ^10.1.4
  flutter_local_notifications: ^20.0.0
  device_info_plus: ^11.5.0
  ota_update: ^7.0.2
  open_filex: ^4.6.0
  # reading .xlsx for the leads import (already pulled in by pdf)
  archive: ^4.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bg/light_bg.webp
    - assets/bg/dark_bg.webp
    - assets/bg/site_backdrop.jpeg
    - assets/images/logo.png
    - assets/images/login_logo.png
    - assets/images/default_photo.jpg
    - assets/images/logo_letter.png
    - assets/images/logo_orbit.png
    - assets/avatar.png
    - assets/l10n/ar.json
    - assets/l10n/en.json
    - assets/jph_l10n/ar.json
    - assets/jph_l10n/en.json
    - assets/jph_l10n/hi.json
    - assets/jph_l10n/ur.json
    - assets/sounds/bell_sound.mp3
    - assets/sounds/notification.mp3
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
    # استمارات: custody receipt template v1 (page drawn from the approved original + field map) and its fonts
    - assets/forms/custody_receipt/v1/fields.json
    - assets/forms/custody_receipt/v1/template.png
    - assets/forms/laptop_receipt/v1/fields.json
    - assets/forms/laptop_receipt/v1/template.png
    - assets/forms/client_intro/v1/fields.json
    - assets/forms/client_intro/v1/template.png
    - assets/forms/reservation/value_group_logo.png
    - assets/fonts/forms/ValueFormNaskh-Regular.ttf
    - assets/fonts/forms/ArimoLatin-Regular.ttf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    # only the flags shown on the login / language screens (Noto Color Emoji subset, SIL OFL — see NotoFlags-OFL.txt);
    # saves the browser downloading the whole 693 KB emoji font for one flag
    - family: NotoFlags
      fonts:
        - asset: assets/fonts/NotoFlags.ttf

# image 4.11 (via pdf/printing) calls ZLibDecoder.decodeLazy, which archive 4.0.9 lacks.
# pub resolves archive 4.0.9 because image under-declares its constraint.
dependency_overrides:
  archive: ^4.0.10
